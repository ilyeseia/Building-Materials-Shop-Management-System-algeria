{% extends "base.html" %}
{% block title %}{{ t('error.400') }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ t('error.400') }}</h1>
  <p class="muted">{{ message if message is defined and message else t('error.400_hint') }}</p>
  <a class="btn secondary" href="{{ url_for('dashboard.index') }}">{{ t('action.back') }}</a>
</div>
{% endblock %}

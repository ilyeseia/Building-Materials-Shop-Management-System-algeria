{% extends "base.html" %}
{% block title %}{{ t('error.400') }}{% endblock %}
{% block content %}
<div class="card error-page">
  <div class="error-code">400</div>
  <p>{{ message if message is defined and message else t('error.400_hint') }}</p>
  <div class="form-actions">
    <a class="btn secondary" href="{{ url_for('dashboard.index') }}">{{ t('action.back') }}</a>
  </div>
</div>
{% endblock %}
